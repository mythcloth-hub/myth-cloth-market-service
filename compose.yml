services:
  rabbitmq:
    image: rabbitmq:4.0-management
    restart: unless-stopped
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: mythcloth
      RABBITMQ_DEFAULT_PASS: mythcloth
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
